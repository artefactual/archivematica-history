description     "MCP Client"
author          "Austin Trask <austin@artefactual.com>"

emits archivematica-client-started

start on (net-device-up
          and local-filesystems
          and started openoffice-service
          and started archivematica-mcp-server
          and runlevel [2345])
stop on runlevel [016]

respawn

env pidFile=/tmp/archivematicaMCPClient.pid
env logFile=/var/archivematica/sharedDirectory/archivematicaMCPClient.log
env CONF=/etc/archivematica/MCPClient

pre-start script
    #Sanity checks
    [ -d $CONF ]
end script

script
    cd /usr/lib/archivematica/MCPClient/
    sudo -u archivematica /usr/bin/twistd --rundir=/usr/lib/archivematica/MCPClient -l $logFile  --pidfile $pidFile -ny /usr/lib/archivematica/MCPClient/archivematicaClient.py >> /tmp/upstart.log 2>&1
    initctl emit archivematica-client-started
end script

pre-stop script
  kill `cat $pidFile`
end script
